# Run the published release images instead of building from source:
#
#   FIRELINE_VERSION=1.0.0 docker compose -f docker-compose.yml -f deploy/docker-compose.images.yml up -d --no-build
#
# Images are built and pushed to GitHub Container Registry by
# .github/workflows/release.yml for every version tag (and :latest).
# The web image is built for a browser that reaches the API at
# http://localhost:4000; build your own (NEXT_PUBLIC_API_URL) for another host.
services:
  migrate:
    image: ghcr.io/kgiannopoulou/fireline-api:${FIRELINE_VERSION:-latest}
    pull_policy: always
  api:
    image: ghcr.io/kgiannopoulou/fireline-api:${FIRELINE_VERSION:-latest}
    pull_policy: always
  worker:
    image: ghcr.io/kgiannopoulou/fireline-worker:${FIRELINE_VERSION:-latest}
    pull_policy: always
  web:
    image: ghcr.io/kgiannopoulou/fireline-web:${FIRELINE_VERSION:-latest}
    pull_policy: always
