name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Integration tests run against real Postgres and Redis, same as locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incidents
          POSTGRES_USER: incidents
          POSTGRES_PASSWORD: incidents
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U incidents"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://incidents:incidents@localhost:5435/incidents
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-only-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (unit + integration) with coverage
        run: npm run test:coverage
      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "*/*/coverage/coverage-summary.json"
          if-no-files-found: warn
      - name: Build web
        run: npm run build -w @irp/web
      - name: Build and pack the SDK
        run: |
          npm run build -w @incident-platform/sdk
          npm pack --dry-run -w @incident-platform/sdk
          # The compiled package (default export condition), as an application would import it.
          node -e "import('@incident-platform/sdk').then((m) => { new m.IncidentClient({ apiKey: 'ir_live_ci' }); console.log('sdk', m.SDK_VERSION, 'ok'); })"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
